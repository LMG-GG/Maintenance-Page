<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Wartungsarbeiten</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #fff;
      color: #202124;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
    }

    .container {
      max-width: 500px;
      padding: 20px;
    }

    .logo {
      font-size: 32px;
      font-weight: bold;
      margin-bottom: 20px;
      letter-spacing: 1px;
    }

    .logo span:nth-child(1) { color: #4285F4; }
    .logo span:nth-child(2) { color: #DB4437; }
    .logo span:nth-child(3) { color: #F4B400; }
    .logo span:nth-child(4) { color: #4285F4; }
    .logo span:nth-child(5) { color: #0F9D58; }
    .logo span:nth-child(6) { color: #DB4437; }

    h1 {
      font-size: 24px;
      font-weight: normal;
      margin-bottom: 10px;
    }

    p {
      color: #5f6368;
      font-size: 14px;
      margin-bottom: 30px;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid #e0e0e0;
      border-top: 4px solid #4285F4;
      border-radius: 50%;
      margin: 0 auto;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .footer {
      margin-top: 30px;
      font-size: 12px;
      color: #9aa0a6;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="logo">
      <span>W</span><span>a</span><span>r</span><span>t</span><span>u</span><span>n</span><span>g</span>
    </div>

    <h1>Wir sind gleich zurück</h1>
    <p>Unsere Website wird derzeit gewartet.<br>
       Bitte versuche es in ein paar Minuten erneut.</p>

    <div class="spinner"></div>

    <div class="footer" id="statusText">
      Status wird geladen...
    </div>
  </div>

  <script>
    // Simulierter Status / kleine Dynamik
    const statusTexts = [
      "Server wird aktualisiert...",
      "Optimierungen laufen...",
      "Fast fertig...",
      "Nur noch ein Moment..."
    ];

    let i = 0;
    const el = document.getElementById("statusText");

    setInterval(() => {
      el.textContent = statusTexts[i % statusTexts.length];
      i++;
    }, 2500);
  </script>

</body>
</html>
